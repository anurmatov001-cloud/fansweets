<style>

  --gold: #e6be63; --gold2: #f3d58a; --hdr: #12081d; --hdr2: #2b1145; --hdrink: #f7e7c0;
  --red: #f87171; --red2: #2a1517; --redline: #5b2328; --redink: #fecaca;
  --amb: #fbbf24; --amb2: #2a2112; --ambline: #5c4716; --ambink: #fde68a;

.wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }

  #tabs a, #tabs button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;

function ledgerOf(c) {

let MEMO = {};
const debtOf = (c) => (MEMO["d" + c.id] ??= ledgerOf(c).reduce((s, r) => s + r.amount, 0));
// Ҳар бир сотув ҳужжати бўйича: тўланди / қолди / ваъда санаси.
// Ҳужжатга боғланган тўлов шу ҳужжатга, боғланмагани ва возвратлар — энг эски ҳужжатга (FIFO).
const promisesOf = (saleId) => S.promises.filter((p) => p.saleId === saleId).sort((a, b) => (a.at || "").localeCompare(b.at || ""));

function allocOf(cid) {
  if (MEMO["a" + cid]) return MEMO["a" + cid];
  const c = custById(cid), term = c ? termOf(c) : 0, t = today();
  const list = liveSales().filter((s) => s.customerId === cid).sort((a, b) => a.at.localeCompare(b.at)).map((s) => ({ s, total: totalOf(s), paid: 0 }));
  const by = Object.fromEntries(list.map((x) => [x.s.id, x]));
  let free = 0;
  for (const p of S.payments) if (p.customerId === cid || (!cid && !p.customerId)) { if (p.saleId && by[p.saleId]) by[p.saleId].paid += p.amount; else free += p.amount; }
  for (const r of S.returns) if (r.customerId === cid) free += r.amount;
  for (const x of list) if (x.paid > x.total) { free += x.paid - x.total; x.paid = x.total; }
  for (const x of list) { const a = Math.min(free, x.total - x.paid); x.paid += a; free -= a; }
  for (const x of list) {
    x.rest = x.total - x.paid;
    const pr = promisesOf(x.s.id).pop();
    x.promised = !!pr; x.due = pr?.date || addDays(x.s.at, term);
    x.late = x.rest > 0 && x.due < t; x.today = x.rest > 0 && x.due === t;
  }
  return (MEMO["a" + cid] = { list, free });
}
const saleInfo = (s) => s.customerId ? allocOf(s.customerId).list.find((x) => x.s.id === s.id) : { total: totalOf(s), paid: S.payments.filter((p) => p.saleId === s.id).reduce((a, p) => a + p.amount, 0), rest: 0 };

async function write(fn, okText) {
  if (S.busy) return;
  if (!S.db) return flash("Маълумот базаси уланмаган. Claude.ai'га кириб, саҳифани қайта очинг.", "err");
  if (S.readOnly) return flash("Сизда фақат кўриш рухсати бор. Эгасидан «Contributor» рухсатини сўранг.", "err");
  S.busy = true; let r;
  try { r = await fn(); const t = typeof okText === "function" ? okText() : okText; if (t) flash(t); }
  catch (e) {
    if (e instanceof UserError) flash(e.message, "err");
    else if (e && (e.code === "permission_denied" || e.code === "invalid_argument")) { S.readOnly = true; flash("Ёзишга рухсат йўқ. Эгасидан «Contributor» рухсатини сўранг.", "err"); }
    else if (e && e.code === "resource_exhausted") flash("База тўлди. Эгасига хабар беринг.", "err");
    else { flash("Ёзилмади. Интернетни текшириб, қайта уриниб кўринг.", "err"); console.error(e); }
  } finally { S.busy = false; render(); }
  return r;
}

// Формадаги маҳсулот қаторларини ўқиш: [{pid, qty, price?}]
function readLines(f, prefix, withPrice) {
  const out = [];
  f.querySelectorAll(`[data-line="${prefix}"]`).forEach((row, i) => {
    const pid = row.querySelector("[data-pid]").value, qRaw = row.querySelector("[data-q]").value.trim();
    if (!pid && !qRaw) return;
    const uq = toInt(qRaw);
    if (!pid || !(uq > 0)) throw new UserError(`${i + 1}-қатор: маҳсулот ва мусбат бутун сон миқдор керак.`);
    const P = partsOf(productById(pid)), unit = P > 1 ? (row.querySelector("[data-u]")?.value || "whole") : "whole";
    const l = { pid, qty: unit === "part" ? uq : uq * P, pp: P, uq, unit };
    if (withPrice) { const pr = toInt(row.querySelector("[data-p]").value); if (!(pr >= 0)) throw new UserError(`${i + 1}-қатор: нарх бутун сон бўлсин (сўм).`); l.price = pr * 100; }
    const same = out.find((x) => x.pid === pid && x.unit === l.unit && x.price === l.price);
    if (same) { same.qty += l.qty; same.uq += uq; } else out.push(l);
  });
  return out;
}
const mv = (l, sign = 1) => ({ pid: l.pid, qty: sign * l.qty, pp: l.pp || 1 });
function checkStock(lines, wh = "main") {
  const want = {}; for (const l of lines) want[l.pid] = (want[l.pid] || 0) + l.qty * partsOf(productById(l.pid)) / (l.pp || 1);
  const short = Object.entries(want).filter(([pid, q]) => balance(pid, wh) < q);
  if (short.length) throw new UserError(`${WH[wh]}да етарли эмас: ` + short.map(([pid, q]) => { const p = productById(pid); return `${pname(pid)} — керак ${qtyText(p, q)}, бор ${qtyText(p, balance(pid, wh))}`; }).join("; "));
}
// Ҳужжат рақами: 100001, 100002 ... (бир вақтда икки ходим ёзса ҳам такрорланмайди)
async function nextNo() {
  const ref = S.db.doc("counters/docs"), holder = (S.uid || "x") + "-" + newId("h");
  for (let i = 0; i < 10; i++) {
    const r = await ref.acquire({ holder, ttlMs: 4000 });
    if (r.acquired) {
      const snap = await ref.get(), cur = snap.exists ? (snap.data().value || 0) : 0;
      const n = Math.max(100000, cur, ...[...S.sales, ...S.returns, ...S.moves].map((d) => d.no || 0)) + 1;
      await ref.set({ value: n, at: nowIso() });
      return n;
    }
    await new Promise((res) => setTimeout(res, 600));
  }
  throw new UserError("Ҳужжат рақами олинмади: бошқа ходим ҳозир ёзяпти. Бир неча сониядан кейин қайта босинг.");
}

  },
  inventory(f) {
    return write(async () => {
      need("inventory");
      const lines = [], log = [];

        const P = partsOf(p), wr = f["inv_" + p.id]?.value.trim() || "", pr = P > 1 ? (f["invp_" + p.id]?.value.trim() || "") : "";
        if (!wr && !pr) continue;
        const w = wr ? toInt(wr) : 0, r = pr ? toInt(pr) : 0;
        if (!(w >= 0) || !(r >= 0)) throw new UserError(`${p.name}: ҳақиқий сон бутун ва 0 ёки ундан катта бўлсин.`);
        const fact = w * P + r, was = balance(p.id), d = fact - was;

      if (!lines.length) throw new UserError("Фарқ йўқ ёки ҳеч нарса ёзилмади. Санаган сонингизни ёзинг.");
      const no = await nextNo();
      await put("moves", newId("m"), { kind: "inv", no, note: f.note.value.trim() || "Инвентаризация", lines });
      await addLog("Инвентаризация", `№${no}: ` + log.join(", "));
      f.reset();
    }, "Инвентаризация сақланди. Қолдиқ ҳақиқий сонга тўғриланди.");
  },
  sale(f) {
    return write(async () => {
      need("sale");
      const kind = S.saleKind, name = f.customer.value.trim(), phone = f.phone.value.trim(), R = rules();
      const lines = readLines(f, "sale", true);
      if (!lines.length) throw new UserError("Камида битта маҳсулот танланг.");
      const discount = f.discount.value.trim() ? toInt(f.discount.value) : 0;
      if (!(discount >= 0 && discount <= 100)) throw new UserError("Чегирма 0 дан 100 гача бутун сон бўлсин.");
      if (!isBoss() && discount > R.discMenejer) throw new UserError(`Менежер чегирмаси ${R.discMenejer}% дан ошмайди. Каттароғини директор беради.`);
      if (!isBoss()) for (const l of lines) { const p = productById(l.pid), base = l.unit === "part" ? partPriceOf(p, kind) : priceOf(p, kind); if (l.price < base) throw new UserError(`${pname(l.pid)}${l.unit === "part" ? " (бўлак)" : ""}: нарх прайсдан паст (${som(base)}). Нархни туширишга рухсатингиз йўқ — чегирма беринг.`); }
      checkStock(lines);
      const total = totalOf({ lines, discount });
      const paid = f.paid.value.trim() ? toInt(f.paid.value) * 100 : 0;
      if (!(paid >= 0)) throw new UserError("Тўланган сумма бутун сон бўлсин (сўм).");
      if (paid > total) throw new UserError("Тўланган сумма сотув суммасидан катта. Ортиқчасини тўлов бўлимида аванс қилиб ёзинг.");
      const unpaid = total - paid;
      if (!name && (kind === "b2b" || unpaid > 0)) throw new UserError(kind === "b2b" ? "Дўкон номини ёзинг." : "Насияга сотилса, мижоз исми керак (қарз кимда эканини билиш учун).");
      const due = readDue(f, unpaid, kind === "b2b" ? "дўкон" : "мижоз");
      let cust = null, isNew = false;
      if (name) ({ c: cust, isNew } = findOrCreateCustomer(kind, name, phone, f.region?.value));
      if (cust && unpaid > 0 && !isBoss()) {
        const debt = isNew ? 0 : debtOf(cust), lim = cust.limit || 0;
        if (lim > 0 && debt + unpaid > lim) throw new UserError(`Кредит лимити: ${som(lim)}. Ҳозирги қарз ${som(debt)} + бу насия ${som(unpaid)} лимитдан ошади. Тўловни кўпайтиринг ёки директорга мурожаат қилинг.`);
        if (R.blockOverdue && !isNew && overdueOf(cust).over > 0) throw new UserError(`Бу мижознинг муддати ўтган қарзи бор: ${som(overdueOf(cust).over)}. Насия берилмайди — аввал тўлов олинг ёки директорга мурожаат қилинг.`);
      }
      if (cust && isNew) await put("customers", cust.id, cust);
      const id = newId("s"), no = await nextNo();
      await put("sales", id, { no, kind, customerId: cust?.id || "", customer: cust?.name || "", lines, discount, total, note: f.note.value.trim() });
      await put("moves", newId("m"), { kind: "sale", saleId: id, ref: no, lines: lines.map((l) => mv(l, -1)) });
      if (paid > 0) await put("payments", newId("t"), { customerId: cust?.id || "", saleId: id, amount: paid, method: f.method.value, note: "Сотувда" });
      if (unpaid > 0) await put("promises", newId("v"), { saleId: id, customerId: cust.id, date: due, amount: unpaid, note: "Сотувда келишилди" });
      if (S.fromOrder && S.orders.some((o) => o.id === S.fromOrder)) { const o = S.orders.find((x) => x.id === S.fromOrder); await S.db.doc("orders/" + o.id).update({ status: "done", saleId: id, saleNo: no, doneAt: nowIso(), doneBy: S.uid || "" }); await addLog("Буюртма сотилди", `Буюртма №${docNo(o)} → сотув №${no}`); S.fromOrder = ""; }
      S.saleRows = 1; S.keepFlash = true;
      location.hash = "sale-" + id;
      return id;
    }, "Сотув ёзилди. Складдан чиқди.");
  },
  cancelSale(s, f) {
    return write(async () => {
      need("sale-cancel");
      if (s.cancelled) throw new UserError("Бу сотув аллақачон бекор қилинган.");
      const reason = f.reason.value.trim(); if (!reason) throw new UserError("Бекор қилиш сабабини ёзинг.");
      await S.db.doc("sales/" + s.id).update({ cancelled: true, cancelReason: reason, cancelledBy: S.uid || "", cancelledAt: nowIso() });
      await put("moves", newId("m"), { kind: "storno", saleId: s.id, note: reason, ref: s.no || "", lines: (s.lines || []).map((l) => mv(l)) });
      await addLog("Сотув бекор қилинди", `№${docNo(s)} · ${som(totalOf(s))} · ${reason}`);
      S.confirmCancel = "";
    }, "Сотув бекор қилинди. Маҳсулот складга қайтди.");
  },
  // Тўлов: ҳужжат танланса — шу ҳужжатга, қарз қолса кейинги сана шарт. «fifo» — энг эски қарзлардан.
  pay(f, fixedCust, fixedSale) {
    let msg = "Тўлов ёзилди. Қарз камайди.";
    return write(async () => {
      need("pay");
      const c = fixedCust || custById(f.cust?.value); if (!c) throw new UserError("Мижозни танланг.");
      const saleId = fixedSale ? fixedSale.id : (f.sale?.value || "fifo");
      const raw = f.amount.value.trim(), amount = raw ? toInt(raw) * 100 : 0;
      if (raw && !(amount > 0)) throw new UserError("Тўлов суммасини мусбат бутун сонда ёзинг (сўм).");
      if (saleId === "fifo") {
        if (!(amount > 0)) throw new UserError("Тўлов суммасини ёзинг (сўм).");
        await put("payments", newId("t"), { customerId: c.id, amount, method: f.method.value, note: f.note.value.trim() });
        return;
      }
      const x = allocOf(c.id).list.find((y) => y.s.id === saleId);
      if (!x) throw new UserError("Ҳужжат топилмади ёки бекор қилинган.");
      if (!amount && !f.due.value) throw new UserError("Тўлов суммасини ёки янги тўлов санасини ёзинг.");
      if (amount > x.rest) throw new UserError(`Бу ҳужжат бўйича қарз ${som(x.rest)}. Ортиқчасини «Энг эски қарзлардан» танлаб ёзинг.`);
      const rest = x.rest - amount, due = readDue(f, rest, c.kind === "b2b" ? "дўкон" : "мижоз");
      if (amount) await put("payments", newId("t"), { customerId: c.id, saleId, amount, method: f.method.value, note: f.note.value.trim() });
      if (rest > 0) await put("promises", newId("v"), { saleId, customerId: c.id, date: due, amount: rest, note: f.note.value.trim() || (amount ? `${som(amount)} тўлади` : "Муддат кўчирилди") });
      msg = rest > 0 ? (amount ? `Тўлов ёзилди. Қолган ${som(rest)} — ${dOnly(due)} га.` : `Янги муддат ёзилди: ${som(rest)} — ${dOnly(due)}.`) : "Тўлов ёзилди. Ҳужжат бўйича қарз ёпилди ✅";
    }, () => msg);
  },
  ret(f, fixedCust) {
    return write(async () => {
      need("returns");
      const c = fixedCust || custById(f.cust.value); if (!c) throw new UserError("Мижозни танланг.");
      const lines = readLines(f, "ret", true), reason = f.reason.value, note = f.note.value.trim(), wh = f.wh.value;
      if (!lines.length) throw new UserError("Қайтган маҳсулот ва миқдорни ёзинг.");
      if (!reason) throw new UserError("Возврат сабабини танланг.");
      if (reason === "Бошқа" && !note) throw new UserError("«Бошқа» танланса, изоҳда сабабни ёзинг.");
      if (!WH[wh]) throw new UserError("Қайси складга тушишини танланг.");
      const amount = lines.reduce((a, l) => a + l.uq * l.price, 0);
      const id = newId("r"), no = await nextNo();
      await put("returns", id, { no, customerId: c.id, lines, amount, wh, reason, note });
      await put("moves", newId("m"), { kind: "ret", wh, returnId: id, ref: no, note: c.name + " · " + reason, lines: lines.map((l) => mv(l)) });
      S.retRows = 1; f.reset();
    }, "Возврат ёзилди. Қарздан айирилди.");
  },
  // Возврат складидан: асосий складга ўтказиш ёки утилизация
  retStock(f) {
    return write(async () => {
      need("ret-stock");
      const lines = readLines(f, "rs", false), act = f.act.value, note = f.note.value.trim();
      if (!lines.length) throw new UserError("Маҳсулот ва миқдорни ёзинг.");
      checkStock(lines, "ret");
      const no = await nextNo();
      if (act === "main") await put("moves", newId("m"), { kind: "transfer", no, note: note || "Возврат складидан асосий складга", lines: lines.flatMap((l) => [{ ...mv(l, -1), wh: "ret" }, { ...mv(l), wh: "main" }]) });
      else await put("moves", newId("m"), { kind: "out", no, wh: "ret", reason: "Утилизация (возврат)", note, lines: lines.map((l) => mv(l, -1)) });
      await addLog(act === "main" ? "Возврат → асосий склад" : "Возврат утилизация", `№${no}: ` + lines.map(lineText).join(", "));
      f.reset();
    }, f.act.value === "main" ? "Асосий складга ўтказилди." : "Утилизация қилинди (ҳисобдан чиқди).");
  },
  addRegion(f) {
    return write(async () => {
      need("regions");
      const name = f.name.value.trim(); if (!name) throw new UserError("Регион номини ёзинг.");
      if (S.regions.some((r) => normName(r.name) === normName(name))) throw new UserError("Бу регион рўйхатда бор.");
      await put("regions", newId("g"), { name, active: true }); f.reset();
    }, "Регион қўшилди.");
  },
  toggleRegion(r) {
    return write(async () => { need("regions"); await S.db.doc("regions/" + r.id).update({ active: r.active === false, editedBy: S.uid || "", editedAt: nowIso() }); await addLog(r.active === false ? "Регион ёқилди" : "Регион яширилди", r.name); },
      r.active === false ? "Регион қайта ёқилди." : "Регион яширилди. Эски мижозларда сақланиб қолади.");
  },
  addReason(f) {
    return write(async () => {
      need("ret-reasons");
      const name = f.name.value.trim(); if (!name) throw new UserError("Сабабни ёзинг.");
      if (retReasons().some((r) => normName(r) === normName(name))) throw new UserError("Бу сабаб рўйхатда бор.");
      await put("retreasons", newId("q"), { name, active: true, order: 50 }); f.reset();
    }, "Сабаб қўшилди.");
  },
  toggleReason(r) {
    return write(async () => { need("ret-reasons"); await S.db.doc("retreasons/" + r.id).update({ active: r.active === false, editedBy: S.uid || "", editedAt: nowIso() }); }, r.active === false ? "Сабаб ёқилди." : "Сабаб яширилди.");
  },
  addCustomer(f) {
    return write(async () => {
      need("clients");
      const kind = S.clientTab, name = f.name.value.trim(), phone = f.phone.value.trim();
      if (!name) throw new UserError(kind === "b2b" ? "Дўкон номини ёзинг." : "Мижоз исмини ёзинг.");
      if (S.customers.some((c) => c.kind === kind && normName(c.name) === normName(name))) throw new UserError("Бу ном базада бор.");
      const digits = phone.replace(/\D/g, "");
      if (digits && S.customers.some((c) => (c.phone || "").replace(/\D/g, "").endsWith(digits.slice(-9)))) throw new UserError("Бу телефон рақам базада бор.");
      await put("customers", newId("c"), { kind, name, phone, region: f.region.value, address: f.address.value.trim(), note: f.note.value.trim() });
      f.reset();
    }, "Мижоз базага қўшилди.");
  },
  editCustomer(c, f) {
    return write(async () => {
      need("clients");
      const name = f.name.value.trim(); if (!name) throw new UserError("Номи бўш бўлмасин.");
      const d = { name, phone: f.phone.value.trim(), region: f.region.value, address: f.address.value.trim(), note: f.note.value.trim(), editedBy: S.uid || "", editedAt: nowIso() };
      if ((c.region || "") !== d.region) await addLog("Регион ўзгарди", `${c.name}: ${regionName(c.region) || "—"} → ${regionName(d.region) || "—"}`);
      if (can("credit")) {
        const lim = f.limit.value.trim() === "" ? null : toInt(f.limit.value), term = f.term.value.trim() === "" ? null : toInt(f.term.value);
        if ((lim != null && !(lim >= 0)) || (term != null && !(term >= 0))) throw new UserError("Лимит ва муддат бутун сон бўлсин.");
        d.limit = lim == null ? null : lim * 100; d.term = term;
        if ((c.limit ?? null) !== d.limit || (c.term ?? null) !== d.term) await addLog("Кредит шартлари", `${c.name}: лимит ${c.limit ? som(c.limit) : "йўқ"} → ${d.limit ? som(d.limit) : "йўқ"}, муддат ${c.term ?? "умумий"} → ${d.term ?? "умумий"} кун`);
      }
      await S.db.doc("customers/" + c.id).update(d);
    }, "Мижоз маълумоти сақланди.");
  },
  saveProduct(f, p) {
    return write(async () => {
      need("products");
      const name = f.name.value.trim(), unit = f.unit.value.trim() || "дона";
      const b2b = toInt(f.b2b.value), b2c = toInt(f.b2c.value), min = f.min.value.trim() ? toInt(f.min.value) : 0;
      if (!name) throw new UserError("Маҳсулот номини ёзинг.");
      if (!(b2b >= 0) || !(b2c >= 0)) throw new UserError("Нархлар бутун сон бўлсин (сўм).");
      if (!(min >= 0)) throw new UserError("Минимал қолдиқ бутун сон бўлсин.");
      if (S.products.some((x) => x.id !== p?.id && normName(x.name) === normName(name))) throw new UserError("Бу номли маҳсулот бор.");
      const split = !!f.split.checked, parts = split ? toInt(f.parts.value) : 1;
      let pb = null, pc = null;
      if (split) {
        if (!(parts >= 2)) throw new UserError("Бутун нечта бўлакка бўлинишини танланг.");
        pb = toInt(f.pb2b.value); pc = toInt(f.pb2c.value);
        if (!(pb >= 0) || !(pc >= 0)) throw new UserError("1 бўлак нархини ёзинг (B2B ва B2C, сўмда).");
      }
      // Бўлак сони ўзгарса, мавжуд қолдиқ янги бўлакка аниқ ўтиши керак
      if (p && partsOf(p) !== (split ? parts : 1)) {
        const Pn = split ? parts : 1;
        for (const wh of ["main", "ret"]) {
          let q = 0; for (const m of S.moves) for (const l of m.lines || []) if (l.pid === p.id && lineWh(m, l) === wh) q += l.qty * Pn / (l.pp || 1);
          if (Math.abs(q - Math.round(q)) > 1e-9) throw new UserError(`${WH[wh]}даги қолдиқ (${qtyText(p, balance(p.id, wh))}) янги бўлакка аниқ бўлинмайди. Аввал инвентаризация билан қолдиқни бутун сонга келтиринг.`);
        }
      }
      const d = { name, unit, priceB2b: b2b * 100, priceB2c: b2c * 100, min, split, parts: split ? parts : 1, partB2b: split ? pb * 100 : null, partB2c: split ? pc * 100 : null };
      if (p) {
        await S.db.doc("products/" + p.id).update({ ...d, editedBy: S.uid || "", editedAt: nowIso() });
        const pt = (x) => `B2B ${som(x.priceB2b || 0)}, B2C ${som(x.priceB2c || 0)}${x.split ? `, бўлак 1/${x.parts}: B2B ${som(x.partB2b || 0)}, B2C ${som(x.partB2c || 0)}` : ""}`;
        if (pt(p) !== pt(d)) await addLog("Нарх ўзгарди", `${name}: ${pt(p)} → ${pt(d)}`);
        S.editProduct = "";
      } else { await put("products", newId("p"), { ...d, active: true }); f.reset(); }
    }, p ? "Маҳсулот сақланди." : "Маҳсулот қўшилди.");
  },
  toggleProduct(p) {
    return write(async () => {
      need("products");
      await S.db.doc("products/" + p.id).update({ active: p.active === false, editedBy: S.uid || "", editedAt: nowIso() });
      await addLog(p.active === false ? "Маҳсулот қайта ёқилди" : "Маҳсулот яширилди", p.name);
    }, p.active === false ? "Маҳсулот қайта ёқилди." : "Маҳсулот яширилди. Тарихи сақланиб қолади.");
  },
  saveRules(f) {
    return write(async () => {
      need("rules");
      const n = {}; for (const k of ["b2bTerm", "b2cTerm", "discMenejer"]) { const v = toInt(f[k].value); if (!(v >= 0)) throw new UserError("Ҳамма қийматлар бутун сон бўлсин."); n[k] = v; }
      if (n.discMenejer > 100) throw new UserError("Чегирма 0–100 оралиғида бўлсин.");
      n.blockOverdue = f.blockOverdue.checked ? 1 : 0;
      n.workStart = f.workStart.value || "08:00";
      if (!/^\d\d:\d\d$/.test(n.workStart)) throw new UserError("Иш бошланиш вақтини ёзинг (масалан 08:00).");
      const o = rules();
      await S.db.doc("settings/main").set({ ...n, ...stamp() });
      await addLog("Қоидалар ўзгарди", Object.keys(n).map((k) => `${k}: ${o[k]} → ${n[k]}`).join(", "));
    }, "Қоидалар сақланди.");
  },
};

const COLS = ["products", "customers", "moves", "sales", "payments", "returns", "logs", "regions", "promises", "retreasons", "roles", "staff", "staffreq", "orders", "attendance"];
// ================= Ходимлар ва лавозимлар (фақат эга ўзгартиради) =================
Object.assign(A, {
  addRole(f) {
    return write(async () => {
      if (!S.isOwner) throw new UserError("Лавозимларни фақат эга (директор) ўзгартиради.");
      const name = f.name.value.trim(); if (!name) throw new UserError("Лавозим номини ёзинг.");
      if (S.roles.some((r) => normName(r.name) === normName(name))) throw new UserError("Бу лавозим бор.");
      const id = newId("role"); await put("roles", id, { name, perms: { home: "view" } }); S.editRole = id; f.reset();
    }, "Лавозим қўшилди. Энди рухсатларини белгиланг.");
  },
  saveRole(r, f) {
    return write(async () => {
      if (!S.isOwner) throw new UserError("Лавозимларни фақат эга (директор) ўзгартиради.");
      const name = f.name.value.trim(); if (!name) throw new UserError("Лавозим номи бўш бўлмасин.");
      const perms = {}; for (const [k] of FUNCS) { const v = f["perm_" + k]?.value || "none"; if (v !== "none") perms[k] = v; }
      await S.db.doc("roles/" + r.id).set({ name, perms, by: r.by || "", at: r.at || nowIso(), editedBy: S.uid || "", editedAt: nowIso() });
      const show = (p) => FUNCS.filter(([k]) => p?.[k]).map(([k, l]) => `${l}:${p[k] === "edit" ? "ўзг." : "кўр."}`).join(", ") || "—";
      await addLog("Лавозим рухсатлари ўзгарди", `${name}: ${show(r.perms)} → ${show(perms)}`);
      S.editRole = "";
    }, "Рухсатлар сақланди. Ходимлар саҳифасида дарҳол ўзгаради.");
  },
  assign(uid, roleId) {
    return write(async () => {
      if (!S.isOwner) throw new UserError("Ходимга лавозимни фақат эга беради.");
      if (!roleId) throw new UserError("Лавозимни танланг.");
      const old = S.staff.find((x) => x.id === uid);
      await S.db.doc("staff/" + uid).set({ roleId, active: true, by: old?.by || S.uid || "", at: old?.at || nowIso(), editedBy: S.uid || "", editedAt: nowIso() });
      await addLog("Ходим лавозими", `${who(uid)}: ${roleById(old?.roleId)?.name || "—"} → ${roleById(roleId)?.name}`);
    }, "Ходимга лавозим берилди.");
  },
  staffOff(x) {
    return write(async () => {
      if (!S.isOwner) throw new UserError("Фақат эга.");
      await S.db.doc("staff/" + x.id).update({ active: x.active === false, editedBy: S.uid || "", editedAt: nowIso() });
      await addLog(x.active === false ? "Ходимга кириш қайта очилди" : "Ходимга кириш ёпилди", who(x.id));
    }, x.active === false ? "Кириш қайта очилди." : "Кириш ёпилди. Ходим энди ҳеч нарсани кўрмайди.");
  },

const hhmm = (iso) => { const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const hoursText = (m) => m ? `${Math.floor(m / 60)} соат ${String(m % 60).padStart(2, "0")} дақ.` : "—";
function attDay(uid, D) {
  const ev = S.attendance.filter((a) => a.uid === uid && localDay(a.at) === D).sort((a, b) => a.at.localeCompare(b.at));
  const ins = ev.filter((a) => a.kind === "in"), outs = ev.filter((a) => a.kind === "out"), last = ev[ev.length - 1];
  const first = ins[0]?.at || null, lastOut = outs.length ? outs[outs.length - 1].at : null, onNow = last?.kind === "in";
  let mins = 0;
  // Бир кунда бир неча марта келиб-кетса ҳам ҳар бир «келди → кетди» оралиғи қўшилади
  let start = null; for (const e of ev) { if (e.kind === "in" && !start) start = e.at; else if (e.kind === "out" && start) { mins += Math.round((new Date(e.at) - new Date(start)) / 6e4); start = null; } }
  if (start && D === today()) mins += Math.round((Date.now() - new Date(start)) / 6e4);
  return { ev, first, lastOut, onNow, mins, late: !!first && hhmm(first) > rules().workStart };
}
function attPeople() {
  const ids = new Set(S.staff.filter((x) => x.active !== false).map((x) => x.id));
  for (const a of S.attendance) if (a.uid) ids.add(a.uid);
  return [...ids].sort((a, b) => who(a).localeCompare(who(b)));
}

  if (!S.uid) return "";

  return `<div class="card attcard"><div><b class="ct" style="margin:0">🕘 Давомат</b><span class="mut">${status}</span></div>
    ${d.onNow ? `<button type="button" class="red" data-a="att" data-id="out">🏁 Кетдим</button>` : `<button type="button" data-a="att" data-id="in">✅ Келдим</button>`}</div>`;
}

function ordCalc() {

function saleCalc() {

}

// Телефонда жадвал карточка бўлади: ҳар бир катакка устун номини ёзиб қўямиз
function cardify(root) {
  root.querySelectorAll("table").forEach((t) => {
    const hs = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (!hs.length) t.classList.add("nohead");
    t.querySelectorAll("tbody tr, tfoot tr").forEach((tr) => {
      let i = 0;
      for (const td of tr.children) { const span = +td.getAttribute("colspan") || 1; if (td.tagName === "TD" && !td.hasAttribute("data-label")) td.setAttribute("data-label", span > 1 ? "" : hs[i] || ""); i += span; }
    });
  });
}

    const p = productById(pid), P = partsOf(p), cell = document.querySelector(`[data-diff="${pid}"]`), wi = document.getElementById("inv_" + pid), pi = document.getElementById("invp_" + pid);
    const wr = wi?.value.trim() || "", pr = pi?.value.trim() || "", w = wr ? toInt(wr) : 0, r = pr ? toInt(pr) : 0;
    if ((!wr && !pr) || Number.isNaN(w) || Number.isNaN(r)) { cell.textContent = "—"; cell.className = "n"; continue; }
    const d = w * P + r - balance(pid); cell.textContent = (d > 0 ? "+" : "") + qtyText(p, d); cell.className = "n " + (d < 0 ? "neg" : d > 0 ? "pos" : "");
  }
}

// ================= Ҳодисалар =================
function clearFormKeep(form) { if (!form) return; form.querySelectorAll("input[id], select[id]").forEach((el) => { if (el.type === "checkbox") el.checked = false; else if (el.tagName === "SELECT") el.selectedIndex = 0; else el.value = ""; }); }
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-f]"); if (!f) return; e.preventDefault();
  const k = f.dataset.f, id = f.dataset.id;
  const before = $("#flash").innerHTML;
  if (k === "stockIn") await A.stockIn(f);
  else if (k === "writeoff") await A.writeoff(f);
  else if (k === "inventory") await A.inventory(f);
  else if (k === "retStock") await A.retStock(f);
  else if (k === "sale") await A.sale(f);
  else if (k === "cancelSale") await A.cancelSale(S.sales.find((s) => s.id === id), f);
  else if (k === "salePay") { const s = S.sales.find((x) => x.id === id); await A.pay(f, custById(s.customerId), s); }
  else if (k === "pay") await A.pay(f, id ? custById(id) : null);
  else if (k === "ret") await A.ret(f, id ? custById(id) : null);
  else if (k === "addCustomer") await A.addCustomer(f);
  else if (k === "editCustomer") await A.editCustomer(custById(id), f);
  else if (k === "saveProduct") await A.saveProduct(f, id ? productById(id) : null);
  else if (k === "saveRules") await A.saveRules(f);
  else if (k === "order") await A.order(f);
  else if (k === "ordCancel") await A.orderStatus(S.orders.find((o) => o.id === id), "cancelled", f.reason.value);
  else if (k === "attManual") await A.attManual(f);
  else if (k === "addRegion") await A.addRegion(f);
  else if (k === "addReason") await A.addReason(f);
  else if (k === "addRole") await A.addRole(f);
  else if (k === "saveRole") await A.saveRole(roleById(id), f);
  // муваффақиятли бўлса — форма тозаланади (рендер сақлаб қолмасин)
  if ($("#flash .msg.ok") && $("#flash").innerHTML !== before && !["editCustomer", "saveRules", "saveRole"].includes(k)) { const nf = document.querySelector(`form[data-f="${k}"]`); if (nf) { clearFormKeep(nf); if (k === "pay" && S.payCust) { const pc = $("#p-cust"); if (pc) pc.value = S.payCust; } saleCalc(); invCalc(); } }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (b) {
    const a = b.dataset.a, id = b.dataset.id;
    if (a === "addrow") { if (id === "ord") S.ordRows++; else if (id === "sale") S.saleRows++; else if (id === "in") S.inRows++; else if (id === "out") S.outRows++; else if (id === "rs") S.rsRows++; else if (id === "ret") S.retRows++; render(); const ns = [...document.querySelectorAll(`[data-line="${id}"] [data-pid]`)].pop(); if (ns) ns.focus(); }
    else if (a === "back") { if (S.depth > 0) { S.backing = true; history.back(); } else { const r = route(); location.hash = r.startsWith("sale-") ? "sales" : r.startsWith("client-") ? (canView("debts") ? "debts" : "clients") : "home"; } }
    else if (a === "pickCust") { const c = custById(id), i = document.getElementById(b.dataset.for); if (c && i) { i.value = c.name; hidePick(); saleCalc(); ordCalc(); } }
    else if (a === "att") A.att(id);
    else if (a === "attTab") { S.attMonth = id === "month" ? (S.attMonth || today().slice(0, 7)) : ""; render(); }
    else if (a === "ordKind") { S.ordKind = id; S.ordRows = 1; render(); clearFormKeep(document.querySelector('[data-f="order"]')); ordCalc(); }
    else if (a === "ordTab") { S.ordTab = id; render(); }
    else if (a === "ordStatus") { const [oid, st] = id.split("|"); A.orderStatus(S.orders.find((o) => o.id === oid), st); }
    else if (a === "ordCancelAsk") { S.ordCancel = id; render(); }
    else if (a === "toSale") orderToSale(S.orders.find((o) => o.id === id));
    else if (a === "csvAtt") csvAtt();
    else if (a === "dayShift") { const d = addDays((S.homeDay || today()) + "T12:00", +id); S.homeDay = d > today() ? today() : d; render(); }
    else if (a === "dayGo") { S.homeDay = ""; render(); }
    else if (a === "saleKind") { S.saleKind = id; S.saleRows = 1; render(); clearFormKeep(document.querySelector('[data-f="sale"]')); saleCalc(); }
    else if (a === "fullpay") { const f = b.form; f.paid.value = f.dataset.total || 0; saleCalc(); }
    else if (a === "restpay") { b.form.amount.value = id; }
    else if (a === "dueIn") { const i = $("#s-due"); if (i) i.value = addDays(nowIso(), +id); }
    else if (["saleTab", "moveTab", "debtTab", "clientTab"].includes(a)) { S[a] = id; render(); }
    else if (a === "saleDay") { S.saleDay = id; render(); }
    else if (a === "cancelAsk") { S.confirmCancel = id; render(); }
    else if (a === "editProduct") { S.editProduct = id; render(); }
    else if (a === "toggleProduct") A.toggleProduct(productById(id));
    else if (a === "toggleRegion") A.toggleRegion(S.regions.find((r) => r.id === id));
    else if (a === "toggleReason") A.toggleReason(S.retreasons.find((r) => r.id === id));
    else if (a === "editRole") { S.editRole = id; render(); }
    else if (a === "permAll") { b.form.querySelectorAll("select[name^=perm_]").forEach((s) => { const opts = [...s.options].map((o) => o.value); s.value = id === "none" ? "none" : opts.includes("edit") ? "edit" : "view"; }); }
    else if (a === "assign") A.assign(id, document.getElementById("as-" + id)?.value);
    else if (a === "staffOff") A.staffOff(S.staff.find((x) => x.id === id));
    else if (a === "viewAs") { S.viewAs = id; try { localStorage.setItem("fss_viewas", id); } catch (x) {} flash(""); location.hash = "home"; render(); }
    else if (a === "sellTo") { const c = custById(id); S.saleKind = c.kind; S.saleRows = 1; location.hash = "sale-new"; setTimeout(() => { const i = $("#s-cust"); if (i) { i.value = c.name; saleCalc(); } }, 0); }
    else if (a === "csvSales") csvSales();
    else if (a === "csvDebts") csvDebts();
    else if (a === "csvLedger") csvLedger(custById(id));
    return;
  }
  const tr = e.target.closest("[data-go]"); if (tr && !e.target.closest("a,button,input,select")) location.hash = tr.dataset.go;
  if (!e.target.closest(".custbox")) hidePick();
});
document.addEventListener("focusin", (e) => { if (e.target.dataset?.pick) showPick(e.target); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePick(); });
document.addEventListener("input", (e) => {
  if (e.target.closest('[data-f="sale"]')) saleCalc();
  if (e.target.dataset.inv) invCalc();
  if (e.target.id === "saleDay") { S.saleDay = e.target.value; render(); }
  if (e.target.dataset?.pick) showPick(e.target);
  if (e.target.closest('[data-f="order"]')) ordCalc();
  if (e.target.id?.startsWith("q-")) { S.q[e.target.id.slice(2)] = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  // Маҳсулот танланса — нарх прайсдан ўзи тушади
  const sel = e.target.closest('[data-line] select');
  if (sel) { const row = sel.closest("[data-line]"); syncUnits(row.parentElement); autoPrice(row); saleCalc(); }
  if (e.target.matches?.("[data-splitchk]")) syncSplit();
  if (e.target.id === "attDay") { S.attDay = e.target.value && e.target.value < today() ? e.target.value : ""; render(); }
  if (e.target.id === "attMonth") { S.attMonth = e.target.value || today().slice(0, 7); render(); }
  if (e.target.id === "homeDay") { S.homeDay = e.target.value && e.target.value < today() ? e.target.value : ""; render(); }
  if (e.target.id === "r-cust") document.querySelectorAll('[data-line="ret"]').forEach(autoPrice);
  if (e.target.id === "regionFilter") { S.regionFilter = e.target.value; render(); }
  if (e.target.id === "p-cust") { S.payCust = e.target.value; render(); }
  if (e.target.id === "viewas") { S.viewAs = e.target.value; try { localStorage.setItem("fss_viewas", S.viewAs); } catch (x) {} flash(""); render(); }
});
window.addEventListener("hashchange", () => { if (route() !== "sale-new") S.fromOrder = ""; if (S.backing) { S.depth = Math.max(0, S.depth - 1); S.backing = false; } else S.depth++; if (!S.keepFlash) flash(""); S.keepFlash = false; S.confirmCancel = ""; document.body.classList.remove("open"); render(); window.scrollTo(0, 0); });
// ----- Кундузги / кечги режим: танлов шу қурилмада эсда қолади -----
const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function paintThemeBtn() {
  const d = isDark(), b = $("#theme"), label = d ? "Кундузги режимга ўтиш" : "Кечги режимга ўтиш";
  b.innerHTML = `<span class="ti">${d ? "☀️" : "🌙"}</span><span class="tl">${d ? "Кундузги" : "Кечги"}</span>`; b.title = label; b.setAttribute("aria-label", label);
}
function setTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("fss_theme", t); } catch (e) {} paintThemeBtn(); }
try { const t = localStorage.getItem("fss_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
paintThemeBtn();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
$("#theme").onclick = () => setTheme(isDark() ? "light" : "dark");
$("#menu").onclick = () => { if (matchMedia("(max-width: 760px)").matches) document.body.classList.toggle("open"); else document.body.classList.toggle("closed"); };
$("#shade").onclick = () => document.body.classList.remove("open");
document.addEventListener("click", (e) => { if (e.target.closest("#tabmenu")) { document.body.classList.toggle("open"); window.scrollTo(0, 0); } });

// ================= CSV (Excel) =================
const csvCell = (v) => { const s = String(v ?? ""); return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = (rows) => "﻿" + rows.map((r) => r.map(csvCell).join(";")).join("\r\n");
async function saveCsv(name, rows) {
  if (!S.downloads) return flash("Файл юклаш бу ерда ишламайди. Claude.ai'да очинг.", "err");
  try { await S.downloads.save({ filename: name, data: toCsv(rows) }); }
  catch (e) { if (e?.code !== "declined") flash("Файл сақланмади. Қайта уриниб кўринг.", "err"); }
}
function csvSales() {
  const list = S.sales.filter((s) => (S.saleTab === "all" || s.kind === S.saleTab) && (!S.saleDay || localDay(s.at) === S.saleDay) && (!S.regionFilter || custById(s.customerId)?.region === S.regionFilter));
  saveCsv(`sotuvlar-${S.saleDay || today()}.csv`, [["№", "Сана", "Тури", "Мижоз", "Регион", "Маҳсулотлар", "Чегирма %", "Сумма", "Тўланди", "Қолди", "Тўлов санаси", "Ҳолат"],
    ...list.map((s) => { const x = saleInfo(s) || {}; return [docNo(s), dt(s.at), s.kind.toUpperCase(), s.customer || "Номсиз", regionName(custById(s.customerId)?.region), (s.lines || []).map((l) => lineText(l)).join(", "), s.discount || 0, totalOf(s) / 100, (x.paid || 0) / 100, s.cancelled ? 0 : (x.rest || 0) / 100, x.rest > 0 ? dOnly(x.due) : "", s.cancelled ? "бекор" : ""]; })]);
}
function csvDebts() {
  if (S.debtTab === "docs") return saveCsv(`qarz-hujjatlar-${today()}.csv`, [["Мижоз", "Телефон", "Регион", "Ҳужжат", "Сана", "Жами", "Тўланди", "Қолди", "Тўлов санаси", "Ўтган"],
    ...S.customers.filter(inRegion).flatMap((c) => openDocs(c).map((x) => [c.name, c.phone || "", regionName(c.region), docNo(x.s), dOnly(x.s.at), x.total / 100, x.paid / 100, x.rest / 100, dOnly(x.due), x.late ? "ҳа" : ""]))]);
  saveCsv(`qarzdorlar-${S.debtTab}-${today()}.csv`, [["Мижоз", "Телефон", "Регион", "Қарз", "Муддати ўтган", "Кейинги тўлов санаси", "Охирги тўлов"],
    ...debtors(S.debtTab).map((x) => [x.c.name, x.c.phone || "", regionName(x.c.region), x.debt / 100, x.over / 100, x.next ? dOnly(x.next) : "", lastPay(x.c) ? dOnly(lastPay(x.c)) : ""])]);
}
function csvLedger(c) {
  saveCsv(`akt-sverka-${c.name.replace(/[^\p{L}\d]+/gu, "-")}-${today()}.csv`, [["Сана", "Ҳаракат", "Тафсилот", "Сумма", "Қолдиқ"], ...ledgerOf(c).map((r) => [dt(r.at), r.type, r.text, r.info ? "" : r.amount / 100, r.info ? "" : r.balance / 100])]);
}

// ================= Улаш =================
render();
let rTimer = 0; const soon = () => { clearTimeout(rTimer); rTimer = setTimeout(render, 30); };
async function boot() {
  if (!window.claude?.use) { S.dbState = "none"; render(); return; }
  const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.downloads = downloads; S.user = user;
  if (!db) { S.dbState = "none"; render(); return; }
  S.db = db;
  if (user) { try { S.uid = (await user.id()) || ""; S.isOwner = !!(await user.isOwner()); } catch (e) {} if (user.can && user.can("data.write") === false) S.readOnly = true; }
  if (!S.isOwner) S.viewAs = "";
  S.identity = true;
  const timer = setTimeout(() => { S.timedOut = true; render(); }, 10000);
  const done = (name, snap) => { if (!snap.metadata?.fromCache) S.loaded.add(name); if (S.loaded.size >= COLS.length + 1) clearTimeout(timer); };
  const fail = (name) => (e) => { console.error(name, e); S.loaded.add(name); soon(); };
  for (const name of COLS) db.collection(name).onSnapshot((snap) => {
    S[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at || "").localeCompare(b.at || ""));
    done(name, snap); resolveNames(); soon();
    if (name === "staffreq" || name === "staff") askAccess();
  }, fail(name));
  db.doc("settings/main").onSnapshot((snap) => { S.settings = snap.exists ? snap.data() : null; done("settings", snap); soon(); }, fail("settings"));
}
// Лавозими йўқ ходим дастурни очса — директорга «рухсат кутаётганлар» рўйхатида кўринади
let asked = false;
async function askAccess() {
  if (asked || S.isOwner || !S.uid || S.readOnly || !S.loaded.has("staff") || !S.loaded.has("staffreq")) return;
  if (S.staff.some((x) => x.id === S.uid) || S.staffreq.some((x) => x.id === S.uid)) return;
  asked = true;
  try { await S.db.doc("staffreq/" + S.uid).set({ at: nowIso() }); } catch (e) {}
}
let nameBusy = false;
async function resolveNames() {
  if (!S.user?.profiles || nameBusy) return;
  const ids = new Set(); for (const n of COLS) for (const d of S[n]) { if (d.by) ids.add(d.by); if (d.cancelledBy) ids.add(d.cancelledBy); }
  for (const x of [...S.staff, ...S.staffreq]) ids.add(x.id);
  for (const a of S.attendance) if (a.uid) ids.add(a.uid);
  const miss = [...ids].filter((i) => i && !(i in S.names)); if (!miss.length) return;
  nameBusy = true;
  try { for (let i = 0; i < miss.length; i += 64) { const ps = await S.user.profiles(miss.slice(i, i + 64)); for (const id of miss.slice(i, i + 64)) S.names[id] = ps?.[id]?.name || ""; } soon(); }
  catch (e) {} finally { nameBusy = false; }
}
boot();
